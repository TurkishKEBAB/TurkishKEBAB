<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="Yigit Okur — enterprise backend, cloud and devops, quality automation">
  <title>Yiğit Okur — enterprise backend · cloud &amp; devops · quality automation</title>

  <!--
    Theme-agnostic by design: transparent background, and every colour holds
    contrast against both #ffffff and #0d1117. No dual-variant picture element
    is needed, so the asset cannot pick the wrong theme.
    Neutral #737b86 measures 4.28:1 on white and 4.42:1 on GitHub dark, which is
    the practical maximum for a single colour across both canvases.
  -->

  <defs>
    <style>
      .mono {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
                     "Liberation Mono", "Courier New", monospace;
      }
    </style>
  </defs>

  <!-- terminal frame -->
  <rect x="1.5" y="1.5" width="897" height="247" rx="12"
        fill="none" stroke="#737b86" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- title bar -->
  <line x1="1.5" y1="52" x2="898.5" y2="52"
        stroke="#737b86" stroke-opacity="0.35" stroke-width="1.5"/>
  <circle cx="28" cy="27" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="27" r="6" fill="#febc2e"/>
  <circle cx="72" cy="27" r="6" fill="#28c840"/>
  <text class="mono" x="96" y="32" font-size="14" fill="#737b86">yigitokur.me — profile</text>
  <text class="mono" x="874" y="32" font-size="14" fill="#737b86" text-anchor="end">İstanbul, TR</text>

  <!-- name -->
  <text class="mono" x="40" y="140" font-size="54" font-weight="700"
        letter-spacing="6" fill="#0099cc">YİĞİT OKUR</text>

  <!--
    The cursor rides in the text flow as a tspan rather than sitting at a fixed
    x, so it cannot land on top of the tagline when font metrics differ between
    the platforms rendering this.
  -->
  <text class="mono" x="40" y="186" font-size="18" fill="#737b86"
    ><tspan fill="#0099cc">$ </tspan>enterprise backend · cloud &amp; devops · quality automation<tspan
      dx="7" fill="#0099cc">█<animate attributeName="opacity" values="1;1;0;0;1"
        keyTimes="0;0.45;0.5;0.95;1" dur="1.15s" repeatCount="indefinite"/></tspan></text>

  <!-- status line -->
  <text class="mono" x="40" y="220" font-size="15" fill="#12926a"
    >● open to backend, platform &amp; DevOps internships</text>
</svg>
